<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPal Cart</title>
  <script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="BK64YWQ8UFG6Q"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #222;
    }
    .shop {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }
    .product {
      padding: 24px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #fff;
    }
    .product h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .product p {
      margin: 0 0 20px;
      color: #666;
    }
    .cart {
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="shop">
    <div class="product">
      <h2>Rebeccac_831's shop</h2>
      <p>Han photocard/details.</p>

      <paypal-add-to-cart-button data-id="QD53TWHWHACZJ"></paypal-add-to-cart-button>
      <script>
        cartPaypal.AddToCart({ id: "QD53TWHWHACZJ" })
      </script>
    </div>

    <div class="cart">
      <paypal-cart-button data-id="pp-view-cart"></paypal-cart-button>
      <script>
        cartPaypal.Cart({ id: "pp-view-cart" })
      </script>
    </div>
  </div>
</body>
</html>
