<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPal Cart</title>
  <script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="BK64YWQ8UFG6Q"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #222;
    }
    .shop {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }
    .shop > h1 {
      font-size: 20px;
      margin: 0 0 20px;
    }
    .product {
      padding: 24px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      background: #fff;
      margin-bottom: 16px;
    }
    .product h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .product p {
      margin: 0 0 20px;
      color: #666;
    }
    .cart {
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="shop">
    <h1>Rebeccac_831's shop</h1>

    <!-- Products render here automatically -->
    <div id="product-list"></div>
  </div>

  <script>
    // ADD NEW PRODUCTS HERE — just add one object per product, nothing else to touch.
    const products = [
      {
        name: "DICON Photobooks",
        id: "U8BAXCDLUSWC2"
      },
      {
        name: "KARMA Skzoo Ver Album",
        id: "NLHCUHWWW4ZE8"
      },
      {
        name: "Bbokari Dominate Japan Skzoo",
        id: "UWLWE4HMDCBLS"
      },
      {
        name: "Dominate Tour in Japan: Blu-Ray",
        id: "QZJYG3KSPT3HS"
      },
      {
        name: "THIS&THAT LP ver photocards",
        id: "7B93V7SESVPHG"
      },
      {
        name: "RUN IT PuppyM cross body bag",
        id: "L3ZGZ4KVRJ8TA"
      },
      {
        name: "RUN IT Dancing Leebit Skzoo",
        id: "HGABXHYPZ9ML2"
      },
      {
        name: "RUN IT Dancing Jiniret Skzoo",
        id: "A82MRZTTZR9ZA"
      },
      {
        name: "RUN IT Dancing Wolf Chan Skzoo",
        id: "DG6VWK3LB6YEU"
      },
      {
        name: "Lightstick Ver 2",
        id: "GGRRDZCLF6N6W"
      },
      {
        name: "KARMA member accordion albums",
        id: "HNRSL5FAT3R32"
      },
      {
        name: "HOLLOW member albums",
        id: "X6TV7WHRK87X2"
      },
      {
        name: "DO IT albums: member select",
        id: "B8B9CME5S6EHE"
      },
      // {
      //   name: "Next product name",
      //   description: "",
      //   id: "PASTE_ID_HERE"
      // },
    ];

    const container = document.getElementById("product-list");

    // Check the URL for ?id=PRODUCT_ID — if present, show only that product.
    // e.g. yoursite.com/paypal-shop.html?id=MV9R884EBSHA6
    const params = new URLSearchParams(window.location.search);
    const requestedId = params.get("id");

    const productsToShow = requestedId
      ? products.filter(p => p.id === requestedId)
      : products;

    productsToShow.forEach((product, index) => {
      const cartButtonId = "pp-view-cart-" + index;

      // Build the product card markup — cart button sits right under add to cart
      const card = document.createElement("div");
      card.className = "product";
      card.innerHTML = `
        <h2>${product.name}</h2>
        ${product.description ? `<p>${product.description}</p>` : ""}
        <paypal-add-to-cart-button data-id="${product.id}"></paypal-add-to-cart-button>
        <div class="cart">
          <paypal-cart-button data-id="${cartButtonId}"></paypal-cart-button>
        </div>
      `;
      container.appendChild(card);

      cartPaypal.AddToCart({ id: product.id });
      cartPaypal.Cart({ id: cartButtonId });
    });
  </script>
</body>
</html>
